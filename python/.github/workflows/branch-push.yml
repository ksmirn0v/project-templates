name: Branch push

# Fast feedback while working on a branch: lint, type checks and tests.
on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: branch-push-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lint, Type Checks and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Checks
        run: make check
