_min_copier_version: "9.0"
_subdirectory: "{{ language }}"
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

language:
  type: str
  help: Which template do you want to use?
  choices:
    - python
  default: python

template:
  type: str
  help: What kind of Python project do you want to create?
  choices:
    Generic Python project: generic
    AWS Lambda function: lambda
  default: generic

project_name:
  type: str
  help: What is your project name (kebab-case)?
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
      use lowercase letters, digits and single dashes, starting with a letter!
    {% endif %}

description:
  type: str
  help: What is your project description?
  default: "TODO: describe this project"
  validator: >-
    {% if '"' in description or '\\' in description %}
      avoid double quotes and backslashes!
    {% endif %}

python_version:
  type: str
  help: What Python version do you want to use?
  choices:
    - "3.12"
    - "3.13"
  default: "3.13"

use_pydantic:
  type: bool
  help: Do you want to add Pydantic as a dependency?
  default: false

namespace:
  type: str
  help: What is your package namespace (src/<namespace>/<package>)? Leave empty for src/<package>.
  default: ""
  validator: >-
    {% if namespace and not (namespace | regex_search('^[a-z][a-z0-9_]*$')) %}
      use lowercase letters, digits and underscores, starting with a letter!
    {% endif %}

aws_account_id:
  type: str
  help: What is the AWS account ID (12 digits)?
  when: "{{ template == 'lambda' }}"
  validator: >-
    {% if not (aws_account_id | regex_search('^[0-9]{12}$')) %}
      use the 12-digit AWS account ID!
    {% endif %}

aws_region:
  type: str
  help: What is the AWS region?
  default: eu-central-1
  when: "{{ template == 'lambda' }}"
  validator: >-
    {% if not (aws_region | regex_search('^[a-z]{2}(-[a-z]+)+-[0-9]$')) %}
      use an AWS region name, e.g. eu-central-1!
    {% endif %}

# --- Derived values (never asked) ----------------------------------
package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

distribution_name:
  type: str
  default: "{{ project_name }}"
  when: false

import_path:
  type: str
  default: "{{ namespace ~ '.' if namespace else '' }}{{ package_name }}"
  when: false

package_dir:
  type: str
  default: "{{ import_path | replace('.', '/') }}"
  when: false

# AWS names of a Lambda project, e.g. for namespace nb1 and project wearables-webhook-receiver:
# function nb1-wearables-webhook-receiver-<env>, ECR repository nb1/wearables-webhook-receiver,
# deploy role nb1-github-wearables-webhook-receiver-deploy-<env>
aws_function_name:
  type: str
  default: "{{ namespace ~ '-' if namespace else '' }}{{ project_name }}"
  when: false

ecr_repository:
  type: str
  default: "{{ namespace ~ '/' if namespace else '' }}{{ project_name }}"
  when: false

aws_deploy_role_name:
  type: str
  default: "{{ namespace ~ '-' if namespace else '' }}github-{{ project_name }}-deploy"
  when: false
